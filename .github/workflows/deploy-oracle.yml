name: Deploy to Oracle VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oracle-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'paulclaim/kegel-trainer' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Syntax-check API
        run: |
          set -euo pipefail
          for f in api/*.js; do node --check "$f"; done
          python3 -c 'import json;json.load(open("api/package.json"))'

      - name: Unit tests
        run: node --test

      - name: Check latest main commit
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [ "$current" = "$GITHUB_SHA" ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            echo 'A newer main commit exists; skipping this older deployment.'
          fi

      - name: Prepare SSH and release
        if: steps.latest.outputs.deploy == 'true'
        env:
          DEPLOY_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          test -n "$KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/oracle_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/oracle_deploy ~/.ssh/known_hosts
          git archive --format=tar --output="$RUNNER_TEMP/release.tar" "$GITHUB_SHA"

      - name: Deploy and verify health
        if: steps.latest.outputs.deploy == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.ORACLE_HOST }}
          DEPLOY_USER: ${{ secrets.ORACLE_USER }}
          DEPLOY_PORT: ${{ secrets.ORACLE_PORT }}
        run: |
          set -euo pipefail
          port="${DEPLOY_PORT:-22}"
          endpoint="$DEPLOY_USER@$DEPLOY_HOST"
          ssh_opts=(-i ~/.ssh/oracle_deploy -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15)
          stage=/var/lib/kegel-trainer-actions
          ssh "${ssh_opts[@]}" -p "$port" "$endpoint" "umask 077; mkdir -p '$stage'; rm -f -- '$stage/release.tar' '$stage/deploy_oracle.py' '$stage/commit'"
          trap 'ssh "${ssh_opts[@]}" -p "$port" "$endpoint" "rm -f -- $stage/release.tar $stage/deploy_oracle.py $stage/commit" || true' EXIT
          scp "${ssh_opts[@]}" -P "$port" "$RUNNER_TEMP/release.tar" scripts/deploy_oracle.py "$endpoint:$stage/"
          printf '%s\n' "$GITHUB_SHA" | ssh "${ssh_opts[@]}" -p "$port" "$endpoint" "umask 077; cat > '$stage/commit'"
          ssh "${ssh_opts[@]}" -p "$port" "$endpoint" "sudo -n /usr/local/sbin/kegel-trainer-deploy"
          printf '### Oracle deployment\n\nDeployed commit: `%s`\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary SSH credentials
        if: always()
        run: rm -f ~/.ssh/oracle_deploy
